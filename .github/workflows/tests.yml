name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skills/scan-to-vector/requirements.txt
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Install Python dependencies
        run: python -m pip install -r skills/scan-to-vector/requirements.txt
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the installer
        run: shellcheck --severity=warning install.sh
      - name: Install into a temporary skills folder
        run: |
          ./install.sh --dir "$RUNNER_TEMP/skills"
          test -f "$RUNNER_TEMP/skills/scan-to-vector/SKILL.md"
          ./install.sh --dir "$RUNNER_TEMP/skills" | grep -q "already up to date"
      - name: Check the plugin manifests are valid JSON
        run: |
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
